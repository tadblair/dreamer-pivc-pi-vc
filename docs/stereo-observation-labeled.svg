<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="552" height="304" viewBox="0 0 552 304" role="img" aria-labelledby="title desc">
  <title id="title">Left eye and right eye observations</title>
  <desc id="desc">Separate 64 by 64 grayscale observations enlarged fourfold with nearest-neighbor scaling, with a 24 pixel gap.</desc>
  <rect width="552" height="304" fill="#ffffff"/>
  <defs>
    <clipPath id="left"><rect x="8" y="40" width="256" height="256"/></clipPath>
    <clipPath id="right"><rect x="288" y="40" width="256" height="256"/></clipPath>
    <image id="stereo" width="512" height="256" xlink:href="data:image/png;base64,"/>
  </defs>
  <g font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#182330" text-anchor="middle">
    <text x="136" y="27">Left eye</text>
    <text x="416" y="27">Right eye</text>
  </g>
  <g clip-path="url(#left)"><use xlink:href="#stereo" x="8" y="40"/></g>
  <g clip-path="url(#right)"><use xlink:href="#stereo" x="32" y="40"/></g>
</svg>
